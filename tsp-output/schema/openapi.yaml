openapi: 3.1.0
info:
  title: Tilbakekreving
  version: 0.0.0
tags:
  - name: behandling
  - name: brev
paths:
  /api/v1/behandling/{behandlingId}/behandlingslogg:
    get:
      operationId: Behandling_behandlingslogg
      parameters:
        - name: behandlingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Logginnslag'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - behandling
  /api/v1/behandling/{behandlingId}/feilutbetaling:
    get:
      operationId: Behandling_fakta
      parameters:
        - name: behandlingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaktaOmFeilutbetaling'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - behandling
    patch:
      operationId: Behandling_oppdaterFakta
      parameters:
        - name: behandlingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaktaOmFeilutbetaling'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - behandling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OppdaterFaktaOmFeilutbetaling'
  /api/v1/behandling/{behandlingId}/foreslå-vedtak:
    post:
      operationId: Behandling_foreslaaVedtak
      parameters:
        - name: behandlingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The request has succeeded.
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - behandling
  /api/v1/behandling/{behandlingId}/vedtak/brev:
    get:
      operationId: Behandling_hentVedtaksbrev
      parameters:
        - name: behandlingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VedtaksbrevData'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - behandling
    put:
      operationId: Behandling_oppdaterVedtaksbrev
      parameters:
        - name: behandlingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VedtaksbrevRedigerbareData'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - behandling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VedtaksbrevRedigerbareDataUpdate'
  /api/v1/behandling/{behandlingId}/vedtak/resultat:
    get:
      operationId: Behandling_hentVedtaksresultat
      parameters:
        - name: behandlingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beregningsresultat'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - behandling
  /api/v1/brev/vedtaksbrev/svg:
    post:
      operationId: Vedtaksbrev_lagSvgVedtaksbrev
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
      tags:
        - brev
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VedtaksbrevData'
components:
  schemas:
    Avsnitt:
      type: object
      required:
        - tittel
        - forklaring
        - meldingerTilSaksbehandler
        - id
        - underavsnitt
      properties:
        tittel:
          type: string
          minLength: 3
          maxLength: 300
        forklaring:
          type: string
          readOnly: true
        meldingerTilSaksbehandler:
          type: array
          items:
            type: string
          readOnly: true
        id:
          type: string
          format: uuid
        underavsnitt:
          type: array
          items:
            $ref: '#/components/schemas/RotElement'
    AvsnittUpdateItem:
      type: object
      required:
        - tittel
        - id
        - underavsnitt
      properties:
        tittel:
          type: string
          minLength: 3
          maxLength: 300
        id:
          type: string
          format: uuid
        underavsnitt:
          type: array
          items:
            $ref: '#/components/schemas/RotElementUpdateItem'
    Beregningsresultat:
      type: object
      required:
        - beregningsresultatsperioder
        - vedtaksresultat
      properties:
        beregningsresultatsperioder:
          type: array
          items:
            $ref: '#/components/schemas/Beregningsresultatsperiode'
        vedtaksresultat:
          $ref: '#/components/schemas/Vedtaksresultat'
    BeregningsresultatVurdering:
      type: string
      enum:
        - GodTro
        - Forsett
        - Uaktsomhet
        - GrovUaktsomhet
    Beregningsresultatsperiode:
      type: object
      required:
        - fom
        - tom
        - feilutbetaltBeløp
        - vurdering
        - andelAvBeløp
        - renteprosent
        - tilbakekrevingsbeløp
        - tilbakekrevesBeløpEtterSkatt
      properties:
        fom:
          type: string
          format: date
        tom:
          type: string
          format: date
        feilutbetaltBeløp:
          type: integer
          format: uint32
        vurdering:
          $ref: '#/components/schemas/BeregningsresultatVurdering'
        andelAvBeløp:
          anyOf:
            - type: integer
              format: uint32
            - type: 'null'
        renteprosent:
          anyOf:
            - type: integer
              format: uint32
            - type: 'null'
        tilbakekrevingsbeløp:
          type: integer
          format: uint32
        tilbakekrevesBeløpEtterSkatt:
          type: integer
          format: uint32
    BestemmelseEllerGrunnlag:
      type: object
      required:
        - nøkkel
        - beskrivelse
      properties:
        nøkkel:
          type: string
        beskrivelse:
          type: string
    Brevmottaker:
      type: object
      required:
        - navn
        - personIdent
      properties:
        navn:
          type: string
        personIdent:
          type: string
    Element:
      type: object
      oneOf:
        - $ref: '#/components/schemas/RentekstElement'
      discriminator:
        propertyName: type
        mapping:
          rentekst: '#/components/schemas/RentekstElement'
    Error:
      type: object
      required:
        - melding
      properties:
        melding:
          type: string
    FaktaOmFeilutbetaling:
      type: object
      required:
        - feilutbetaling
        - tidligereVarsletBeløp
        - muligeRettsligGrunnlag
        - perioder
        - vurdering
        - ferdigvurdert
      properties:
        feilutbetaling:
          $ref: '#/components/schemas/Feilutbetaling'
        tidligereVarsletBeløp:
          anyOf:
            - type: integer
              format: uint32
            - type: 'null'
        muligeRettsligGrunnlag:
          type: array
          items:
            $ref: '#/components/schemas/MuligeRettsligGrunnlag'
        perioder:
          type: array
          items:
            $ref: '#/components/schemas/FaktaPeriode'
        vurdering:
          $ref: '#/components/schemas/Vurdering'
        ferdigvurdert:
          type: boolean
    FaktaPeriode:
      type: object
      required:
        - id
        - fom
        - tom
        - feilutbetaltBeløp
        - splittbarePerioder
        - rettsligGrunnlag
      properties:
        id:
          type: string
        fom:
          type: string
          format: date
        tom:
          type: string
          format: date
        feilutbetaltBeløp:
          type: integer
          format: uint32
        splittbarePerioder:
          type: array
          items:
            type: object
            required:
              - id
              - fom
              - tom
              - feilutbetaltBeløp
              - rettsligGrunnlag
            properties:
              id:
                type: string
              fom:
                type: string
                format: date
              tom:
                type: string
                format: date
              feilutbetaltBeløp:
                type: integer
                format: uint32
              rettsligGrunnlag:
                type: array
                items:
                  $ref: '#/components/schemas/RettsligGrunnlag'
            description: The template for omitting properties.
        rettsligGrunnlag:
          type: array
          items:
            $ref: '#/components/schemas/RettsligGrunnlag'
    Feilutbetaling:
      type: object
      required:
        - beløp
        - fom
        - tom
        - revurdering
      properties:
        beløp:
          type: integer
          format: uint32
        fom:
          type: string
          format: date
        tom:
          type: string
          format: date
        revurdering:
          $ref: '#/components/schemas/Revurdering'
    Fritekst:
      type: string
      minLength: 3
      maxLength: 3000
    Hovedavsnitt:
      type: object
      required:
        - tittel
        - forklaring
        - underavsnitt
        - hjemler
      properties:
        tittel:
          type: string
          minLength: 3
          maxLength: 300
        forklaring:
          type: string
          readOnly: true
        underavsnitt:
          type: array
          items:
            $ref: '#/components/schemas/RotElement'
        hjemler:
          type: string
    HovedavsnittUpdate:
      type: object
      required:
        - tittel
        - underavsnitt
      properties:
        tittel:
          type: string
          minLength: 3
          maxLength: 300
        underavsnitt:
          type: array
          items:
            $ref: '#/components/schemas/RotElementUpdateItem'
    Logginnslag:
      type: object
      required:
        - behandlingId
        - opprettetTid
        - type
        - aktør
        - aktørIdent
        - tittel
        - tekst
        - steg
      properties:
        behandlingId:
          type: string
        opprettetTid:
          type: string
          format: date-time
        type:
          type: string
        aktør:
          type: string
        aktørIdent:
          type: string
        tittel:
          type: string
        tekst:
          anyOf:
            - type: string
            - type: 'null'
        steg:
          anyOf:
            - type: string
            - type: 'null'
    MuligeRettsligGrunnlag:
      type: object
      required:
        - bestemmelse
        - grunnlag
      properties:
        bestemmelse:
          $ref: '#/components/schemas/BestemmelseEllerGrunnlag'
        grunnlag:
          type: array
          items:
            $ref: '#/components/schemas/BestemmelseEllerGrunnlag'
    Oppdaget:
      type: object
      required:
        - dato
        - av
        - beskrivelse
      properties:
        dato:
          anyOf:
            - type: string
              format: date
            - type: 'null'
        av:
          type: string
          enum:
            - NAV
            - BRUKER
            - IKKE_VURDERT
        beskrivelse:
          anyOf:
            - $ref: '#/components/schemas/Fritekst'
            - type: 'null'
    OppdaterFaktaOmFeilutbetaling:
      type: object
      properties:
        perioder:
          type: array
          items:
            $ref: '#/components/schemas/OppdaterFaktaPeriode'
        vurdering:
          $ref: '#/components/schemas/Vurdering'
    OppdaterFaktaPeriode:
      type: object
      required:
        - id
        - rettsligGrunnlag
      properties:
        id:
          type: string
        rettsligGrunnlag:
          type: array
          items:
            $ref: '#/components/schemas/RettsligGrunnlag'
          minItems: 1
    Oppsummeringsdata:
      type: object
      required:
        - fom
        - tom
        - feilutbetaltBeløp
        - vurdering
        - andelAvBeløp
        - renteprosent
        - tilbakekrevingsbeløp
        - tilbakekrevesBeløpEtterSkatt
      properties:
        fom:
          type: string
        tom:
          type: string
        feilutbetaltBeløp:
          type: string
        vurdering:
          type: string
        andelAvBeløp:
          type: string
        renteprosent:
          type: string
        tilbakekrevingsbeløp:
          type: string
        tilbakekrevesBeløpEtterSkatt:
          type: string
    PakrevdBegrunnelse:
      type: object
      required:
        - tittel
        - forklaring
        - meldingerTilSaksbehandler
        - begrunnelseType
        - underavsnitt
      properties:
        tittel:
          type: string
        forklaring:
          type: string
          readOnly: true
        meldingerTilSaksbehandler:
          type: array
          items:
            type: string
          readOnly: true
        begrunnelseType:
          type: string
        underavsnitt:
          type: array
          items:
            $ref: '#/components/schemas/Element'
      x-kotlin-implements:
        - RotElementDto
        - RotElementUpdateItemDto
    PakrevdBegrunnelseUpdateItem:
      type: object
      required:
        - begrunnelseType
        - underavsnitt
      properties:
        begrunnelseType:
          type: string
        underavsnitt:
          type: array
          items:
            $ref: '#/components/schemas/Element'
      x-kotlin-implements:
        - RotElementDto
        - RotElementUpdateItemDto
    RentekstElement:
      type: object
      required:
        - tekst
      properties:
        tekst:
          type: string
          minLength: 3
          maxLength: 3000
      x-kotlin-implements:
        - RotElementDto
        - RotElementUpdateItemDto
    RettsligGrunnlag:
      type: object
      required:
        - bestemmelse
        - grunnlag
      properties:
        bestemmelse:
          type: string
          minLength: 1
        grunnlag:
          type: string
          minLength: 1
    Revurdering:
      type: object
      required:
        - årsak
        - vedtaksdato
        - resultat
      properties:
        årsak:
          type: string
        vedtaksdato:
          type: string
          format: date
        resultat:
          type: string
          enum:
            - INNVILGET
            - OPPHØRT
    RotElement:
      type: object
      oneOf:
        - $ref: '#/components/schemas/RentekstElement'
        - $ref: '#/components/schemas/UnderavsnittElement'
        - $ref: '#/components/schemas/PakrevdBegrunnelse'
      discriminator:
        propertyName: type
        mapping:
          rentekst: '#/components/schemas/RentekstElement'
          underavsnitt: '#/components/schemas/UnderavsnittElement'
          påkrevd_begrunnelse: '#/components/schemas/PakrevdBegrunnelse'
    RotElementUpdateItem:
      type: object
      oneOf:
        - $ref: '#/components/schemas/RentekstElement'
        - $ref: '#/components/schemas/UnderavsnittElement'
        - $ref: '#/components/schemas/PakrevdBegrunnelseUpdateItem'
      discriminator:
        propertyName: type
        mapping:
          rentekst: '#/components/schemas/RentekstElement'
          underavsnitt: '#/components/schemas/UnderavsnittElement'
          påkrevd_begrunnelse: '#/components/schemas/PakrevdBegrunnelseUpdateItem'
    Signatur:
      type: object
      required:
        - enhetNavn
        - ansvarligSaksbehandler
        - besluttendeSaksbehandler
      properties:
        enhetNavn:
          type: string
        ansvarligSaksbehandler:
          type: string
        besluttendeSaksbehandler:
          anyOf:
            - type: string
            - type: 'null'
    Standardtekst:
      type: object
      required:
        - tittel
        - underavsnitt
      properties:
        tittel:
          type: string
        underavsnitt:
          type: array
          items:
            $ref: '#/components/schemas/Element'
    UnderavsnittElement:
      type: object
      required:
        - tittel
        - underavsnitt
      properties:
        tittel:
          type: string
        underavsnitt:
          type: array
          items:
            $ref: '#/components/schemas/Element'
      x-kotlin-implements:
        - RotElementDto
        - RotElementUpdateItemDto
    VedtaksbrevData:
      type: object
      required:
        - hovedavsnitt
        - avsnitt
        - sistOppdatert
        - brevGjelder
        - sendtDato
        - ytelse
        - signatur
        - oppsummeringstabell
        - bunntekster
        - saksnummer
      properties:
        hovedavsnitt:
          $ref: '#/components/schemas/Hovedavsnitt'
        avsnitt:
          type: array
          items:
            $ref: '#/components/schemas/Avsnitt'
        sistOppdatert:
          type: string
          format: date-time
          readOnly: true
        brevGjelder:
          $ref: '#/components/schemas/Brevmottaker'
        sendtDato:
          type: string
        ytelse:
          $ref: '#/components/schemas/Ytelse'
        signatur:
          $ref: '#/components/schemas/Signatur'
        oppsummeringstabell:
          type: array
          items:
            $ref: '#/components/schemas/Oppsummeringsdata'
        bunntekster:
          type: array
          items:
            $ref: '#/components/schemas/Standardtekst'
        saksnummer:
          type: string
    VedtaksbrevRedigerbareData:
      type: object
      required:
        - hovedavsnitt
        - avsnitt
        - sistOppdatert
      properties:
        hovedavsnitt:
          $ref: '#/components/schemas/Hovedavsnitt'
        avsnitt:
          type: array
          items:
            $ref: '#/components/schemas/Avsnitt'
        sistOppdatert:
          type: string
          format: date-time
          readOnly: true
    VedtaksbrevRedigerbareDataUpdate:
      type: object
      required:
        - hovedavsnitt
        - avsnitt
      properties:
        hovedavsnitt:
          $ref: '#/components/schemas/HovedavsnittUpdate'
        avsnitt:
          type: array
          items:
            $ref: '#/components/schemas/AvsnittUpdateItem'
    Vedtaksresultat:
      type: string
      enum:
        - IngenTilbakebetaling
        - DelvisTilbakebetaling
        - FullTilbakebetaling
    Vurdering:
      type: object
      required:
        - årsak
      properties:
        årsak:
          anyOf:
            - $ref: '#/components/schemas/Fritekst'
            - type: 'null'
          minLength: 3
          maxLength: 3000
        oppdaget:
          $ref: '#/components/schemas/Oppdaget'
    Ytelse:
      type: object
      required:
        - url
        - ubestemtEntall
        - bestemtEntall
      properties:
        url:
          type: string
        ubestemtEntall:
          type: string
        bestemtEntall:
          type: string
