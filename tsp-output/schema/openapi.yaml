      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VedtaksbrevData'
components:
  schemas:
    Avsnitt:
      type: object
      required:
        - tittel
        - forklaring
        - meldingerTilSaksbehandler
        - id
        - underavsnitt
      properties:
        tittel:
          type: string
          minLength: 3
          maxLength: 300
        forklaring:
          type: string
          readOnly: true
        meldingerTilSaksbehandler:
          type: array
          items:
            type: string
          readOnly: true
        id:
          type: string
          format: uuid
        underavsnitt:
          type: array
          items:
            $ref: '#/components/schemas/RotElement'
    AvsnittUpdateItem:
      type: object
      required:
        - tittel
        - id
        - underavsnitt
      properties:
        tittel:
          type: string
          minLength: 3
          maxLength: 300
        id:
          type: string
          format: uuid
        underavsnitt:
          type: array
          items:
            $ref: '#/components/schemas/RotElementUpdateItem'
    Beregningsresultat:
      type: object
      required:
        - beregningsresultatsperioder
        - vedtaksresultat
      properties:
        beregningsresultatsperioder:
          type: array
          items:
            $ref: '#/components/schemas/Beregningsresultatsperiode'
        vedtaksresultat:
          $ref: '#/components/schemas/Vedtaksresultat'
    BeregningsresultatVurdering:
      type: string
      enum:
        - GodTro
        - Forsett
        - Uaktsomhet
        - GrovUaktsomhet
        - BurdeForstått
        - Forstod
    Beregningsresultatsperiode:
      type: object
      required:
        - fom
        - tom
        - feilutbetaltBeløp
        - vurdering
        - andelAvBeløp
        - renteprosent
        - tilbakekrevingsbeløp
        - tilbakekrevesBeløpEtterSkatt
      properties:
        fom:
          type: string
          format: date
        tom:
          type: string
          format: date
        feilutbetaltBeløp:
          type: integer
          format: uint32
        vurdering:
          $ref: '#/components/schemas/BeregningsresultatVurdering'
        andelAvBeløp:
          anyOf:
            - type: integer
              format: uint32
            - type: 'null'
        renteprosent:
          anyOf:
            - type: integer
              format: uint32
            - type: 'null'
        tilbakekrevingsbeløp:
          type: integer
          format: uint32
        tilbakekrevesBeløpEtterSkatt:
          type: integer
          format: uint32
    BestemmelseEllerGrunnlag:
      type: object
      required:
        - nøkkel
        - beskrivelse
      properties:
        nøkkel:
          type: string
        beskrivelse:
          type: string
    Brevmottaker:
      type: object
      required:
        - navn
        - personIdent
      properties:
        navn:
          type: string
        personIdent:
          type: string
    DokumentInfo:
      type: object
      required:
        - journalpostId
        - dokumentId
      properties:
        journalpostId:
          anyOf:
            - type: string
            - type: 'null'
        dokumentId:
          anyOf:
            - type: string
            - type: 'null'
    DokumentType:
      type: string
      enum:
        - VARSELBREV
        - VEDTAKSBREV
    Element:
      type: object
      oneOf:
        - $ref: '#/components/schemas/RentekstElement'
      discriminator:
        propertyName: type
        mapping:
          rentekst: '#/components/schemas/RentekstElement'
    Error:
      type: object
      required:
        - tittel
        - melding
      properties:
        tittel:
          type: string
        melding:
          type: string
    FaktaOmFeilutbetaling:
      type: object
      required:
        - feilutbetaling
        - tidligereVarsletBeløp
        - muligeRettsligGrunnlag
        - perioder
        - vurdering
        - ferdigvurdert
      properties:
        feilutbetaling:
          $ref: '#/components/schemas/Feilutbetaling'
        tidligereVarsletBeløp:
          anyOf:
            - type: integer
              format: uint32
            - type: 'null'
        muligeRettsligGrunnlag:
          type: array
          items:
            $ref: '#/components/schemas/MuligeRettsligGrunnlag'
        perioder:
          type: array
          items:
            $ref: '#/components/schemas/FaktaPeriode'
        vurdering:
          $ref: '#/components/schemas/Vurdering'
        ferdigvurdert:
          type: boolean
    FaktaPeriode:
      type: object
      required:
        - id
        - fom
        - tom
        - feilutbetaltBeløp
        - splittbarePerioder
        - rettsligGrunnlag
      properties:
        id:
          type: string
        fom:
          type: string
          format: date
        tom:
          type: string
          format: date
        feilutbetaltBeløp:
          type: integer
          format: uint32
        splittbarePerioder:
          type: array
          items:
            type: object
            required:
              - id
              - fom
              - tom
              - feilutbetaltBeløp
              - rettsligGrunnlag
            properties:
              id:
                type: string
              fom:
                type: string
                format: date
              tom:
                type: string
                format: date
              feilutbetaltBeløp:
                type: integer
                format: uint32
              rettsligGrunnlag:
                type: array
                items:
                  $ref: '#/components/schemas/RettsligGrunnlag'
            description: The template for omitting properties.
        rettsligGrunnlag:
          type: array
          items:
            $ref: '#/components/schemas/RettsligGrunnlag'
    Feilutbetaling:
      type: object
      required:
        - beløp
        - fom
        - tom
        - revurdering
      properties:
        beløp:
          type: integer
          format: uint32
        fom:
          type: string
          format: date
        tom:
          type: string
          format: date
        revurdering:
          $ref: '#/components/schemas/Revurdering'
    ForhaandsvarselErSendt:
      type: object
      required:
        - forhåndsvarselInfo
        - uttalelsesfrist
      properties:
        forhåndsvarselInfo:
          $ref: '#/components/schemas/ForhaandsvarselInfo'
        uttalelsesfrist:
          $ref: '#/components/schemas/Uttalelsesfrist'
      x-kotlin-implements:
        - ForhaandsvarselStegDto
    ForhaandsvarselInfo:
      type: object
      required:
        - tekstFraSaksbehandler
        - varselbrevSendtTid
      properties:
        tekstFraSaksbehandler:
          type: string
        varselbrevSendtTid:
          type: string
          format: date
    ForhaandsvarselResponse:
      type: object
      required:
        - forhaandsvarselSteg
        - brukeruttalelse
      properties:
        forhaandsvarselSteg:
          $ref: '#/components/schemas/ForhaandsvarselSteg'
        brukeruttalelse:
          anyOf:
            - $ref: '#/components/schemas/Uttalelse'
            - type: 'null'
    ForhaandsvarselSteg:
      type: object
      oneOf:
        - $ref: '#/components/schemas/IkkeVurdert'
        - $ref: '#/components/schemas/ForhaandsvarselErSendt'
        - $ref: '#/components/schemas/ForhaandsvarselUnntak'
      discriminator:
        propertyName: type
        mapping:
          ikke_vurdert: '#/components/schemas/IkkeVurdert'
          sendt: '#/components/schemas/ForhaandsvarselErSendt'
          unntak: '#/components/schemas/ForhaandsvarselUnntak'
    ForhaandsvarselUnntak:
      type: object
      required:
        - begrunnelseForUnntak
        - beskrivelse
      properties:
        begrunnelseForUnntak:
          $ref: '#/components/schemas/Varslingsunntak'
        beskrivelse:
          type: string
      x-kotlin-implements:
        - ForhaandsvarselStegDto
    Fritekst:
      type: string
      minLength: 3
      maxLength: 3000
    Hovedavsnitt:
      type: object
      required:
        - tittel
        - forklaring
        - underavsnitt
        - hjemler
      properties:
        tittel:
          type: string
          minLength: 3
          maxLength: 300
        forklaring:
          type: string
          readOnly: true
        underavsnitt:
          type: array
          items:
            $ref: '#/components/schemas/RotElement'
        hjemler:
          type: string
    HovedavsnittUpdate:
      type: object
      required:
        - tittel
        - underavsnitt
      properties:
        tittel:
          type: string
          minLength: 3
          maxLength: 300
        underavsnitt:
          type: array
          items:
            $ref: '#/components/schemas/RotElementUpdateItem'
    IkkeVurdert:
      type: object
      x-kotlin-implements:
        - ForhaandsvarselStegDto
    Logginnslag:
      type: object
      required:
        - behandlingId
        - opprettetTid
        - type
        - aktør
        - aktørIdent
        - tittel
        - tekst
        - steg
        - ekstraInfo
      properties:
        behandlingId:
          type: string
        opprettetTid:
          type: string
          format: date-time
        type:
          type: string
        aktør:
          type: string
        aktørIdent:
          type: string
        tittel:
          type: string
        tekst:
          anyOf:
            - type: string
            - type: 'null'
        steg:
          anyOf:
            - type: string
            - type: 'null'
        ekstraInfo:
          type: object
          unevaluatedProperties: {}
    MuligeRettsligGrunnlag:
      type: object
      required:
        - bestemmelse
        - grunnlag
      properties:
        bestemmelse:
