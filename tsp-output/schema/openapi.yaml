  /api/v1/behandling/{behandlingId}/{dokumentType}/gjeldende:
    get:
      operationId: Behandling_hentDokumentInfo
      parameters:
        - name: behandlingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: dokumentType
          in: path
          required: true
          schema:
