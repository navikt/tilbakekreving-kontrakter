openapi: 3.1.0
info:
  title: Tilbakekreving
  version: 0.0.0
tags:
  - name: behandling
  - name: brev
paths:
  /api/v1/behandling/{behandlingId}/feilutbetaling:
    get:
      operationId: Behandling_fakta
      parameters:
        - name: behandlingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaktaOmFeilutbetaling'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - behandling
    patch:
      operationId: Behandling_oppdaterFakta
      parameters:
        - name: behandlingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaktaOmFeilutbetaling'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - behandling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OppdaterFaktaOmFeilutbetaling'
  /api/v1/behandling/{behandlingId}/vedtak/brev:
    get:
      operationId: Behandling_hentVedtaksbrev
      parameters:
        - name: behandlingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vedtaksbrev'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - behandling
  /api/v1/brev/vedtaksbrev/svg:
    post:
      operationId: Vedtaksbrev_lagSvgVedtaksbrev
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
      tags:
        - brev
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VedtaksbrevData'
components:
  schemas:
    Avsnitt:
      type: object
      required:
        - tittel
        - underavsnitt
      properties:
        tittel:
          type: string
          minLength: 3
          maxLength: 300
        underavsnitt:
          type: array
          items:
            $ref: '#/components/schemas/RotElement'
    BestemmelseEllerGrunnlag:
      type: object
      required:
        - nøkkel
        - beskrivelse
      properties:
        nøkkel:
          type: string
        beskrivelse:
          type: string
    Brevmottaker:
      type: object
      required:
        - fullName
        - personIdent
      properties:
        fullName:
          type: string
        personIdent:
          type: string
    Element:
      type: object
      oneOf:
        - $ref: '#/components/schemas/RentekstElement'
      discriminator:
        propertyName: type
        mapping:
          rentekst: '#/components/schemas/RentekstElement'
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    FaktaOmFeilutbetaling:
      type: object
      required:
        - feilutbetaling
        - tidligereVarsletBeløp
        - muligeRettsligGrunnlag
        - perioder
        - vurdering
        - ferdigvurdert
      properties:
        feilutbetaling:
          $ref: '#/components/schemas/Feilutbetaling'
        tidligereVarsletBeløp:
          anyOf:
            - type: integer
              format: uint32
            - type: 'null'
        muligeRettsligGrunnlag:
          type: array
          items:
            $ref: '#/components/schemas/MuligeRettsligGrunnlag'
        perioder:
          type: array
          items:
            $ref: '#/components/schemas/FaktaPeriode'
        vurdering:
          $ref: '#/components/schemas/Vurdering'
        ferdigvurdert:
          type: boolean
    FaktaPeriode:
      type: object
      required:
        - id
        - fom
        - tom
        - feilutbetaltBeløp
        - splittbarePerioder
        - rettsligGrunnlag
      properties:
        id:
          type: string
        fom:
          type: string
          format: date
        tom:
          type: string
          format: date
        feilutbetaltBeløp:
          type: integer
          format: uint32
        splittbarePerioder:
          type: array
          items:
            type: object
            required:
              - id
              - fom
              - tom
              - feilutbetaltBeløp
              - rettsligGrunnlag
            properties:
              id:
                type: string
              fom:
                type: string
                format: date
              tom:
                type: string
                format: date
              feilutbetaltBeløp:
                type: integer
                format: uint32
              rettsligGrunnlag:
                type: array
                items:
                  $ref: '#/components/schemas/RettsligGrunnlag'
            description: The template for omitting properties.
        rettsligGrunnlag:
          type: array
          items:
            $ref: '#/components/schemas/RettsligGrunnlag'
    Feilutbetaling:
      type: object
      required:
        - beløp
        - fom
        - tom
        - revurdering
      properties:
        beløp:
          type: integer
          format: uint32
        fom:
          type: string
          format: date
        tom:
          type: string
          format: date
        revurdering:
          $ref: '#/components/schemas/Revurdering'
    Fritekst:
      type: string
      minLength: 3
      maxLength: 3000
    Hovedavsnitt:
      type: object
      required:
        - tittel
        - underavsnitt
      properties:
        tittel:
          type: string
          minLength: 3
          maxLength: 300
        underavsnitt:
          type: array
          items:
            $ref: '#/components/schemas/RotElement'
    MuligeRettsligGrunnlag:
      type: object
      required:
        - bestemmelse
        - grunnlag
      properties:
        bestemmelse:
          $ref: '#/components/schemas/BestemmelseEllerGrunnlag'
        grunnlag:
          type: array
          items:
            $ref: '#/components/schemas/BestemmelseEllerGrunnlag'
    Oppdaget:
      type: object
      required:
        - dato
        - av
        - beskrivelse
      properties:
        dato:
          anyOf:
            - type: string
              format: date
            - type: 'null'
        av:
          type: string
          enum:
            - NAV
            - BRUKER
            - IKKE_VURDERT
        beskrivelse:
          anyOf:
            - $ref: '#/components/schemas/Fritekst'
            - type: 'null'
    OppdaterFaktaOmFeilutbetaling:
      type: object
      properties:
        perioder:
          type: array
          items:
            $ref: '#/components/schemas/OppdaterFaktaPeriode'
        vurdering:
          $ref: '#/components/schemas/Vurdering'
    OppdaterFaktaPeriode:
      type: object
      required:
        - id
        - rettsligGrunnlag
      properties:
        id:
          type: string
        rettsligGrunnlag:
          type: array
          items:
            $ref: '#/components/schemas/RettsligGrunnlag'
          minItems: 1
    RentekstElement:
      type: object
      required:
        - tekst
      properties:
        tekst:
          type: string
          minLength: 3
          maxLength: 3000
    RettsligGrunnlag:
      type: object
      required:
        - bestemmelse
        - grunnlag
      properties:
        bestemmelse:
          type: string
          minLength: 1
        grunnlag:
          type: string
          minLength: 1
    Revurdering:
      type: object
      required:
        - årsak
        - vedtaksdato
        - resultat
      properties:
        årsak:
          type: string
        vedtaksdato:
          type: string
          format: date
        resultat:
          type: string
          enum:
            - INNVILGET
            - OPPHØRT
    RotElement:
      type: object
      oneOf:
        - $ref: '#/components/schemas/RentekstElement'
        - $ref: '#/components/schemas/UnderavsnittElement'
      discriminator:
        propertyName: type
        mapping:
          rentekst: '#/components/schemas/RentekstElement'
          underavsnitt: '#/components/schemas/UnderavsnittElement'
    Signatur:
      type: object
      required:
        - enhetNavn
        - ansvarligSaksbehandler
        - besluttendeSaksbehandler
      properties:
        enhetNavn:
          type: string
        ansvarligSaksbehandler:
          type: string
        besluttendeSaksbehandler:
          anyOf:
            - type: string
            - type: 'null'
    UnderavsnittElement:
      type: object
      required:
        - tittel
        - underavsnitt
      properties:
        tittel:
          type: string
        underavsnitt:
          type: array
          items:
            $ref: '#/components/schemas/Element'
    Vedtaksbrev:
      type: object
      required:
        - innledning
        - perioder
        - brevGjelder
        - ytelse
        - signatur
      properties:
        innledning:
          type: array
          items:
            $ref: '#/components/schemas/Element'
        perioder:
          type: array
          items:
            $ref: '#/components/schemas/VedtaksbrevPeriode'
        brevGjelder:
          $ref: '#/components/schemas/Brevmottaker'
        ytelse:
          $ref: '#/components/schemas/Ytelse'
        signatur:
          $ref: '#/components/schemas/Signatur'
    VedtaksbrevData:
      type: object
      required:
        - hovedavsnitt
        - avsnitt
        - brevGjelder
        - sendtDato
        - ytelse
        - signatur
      properties:
        hovedavsnitt:
          $ref: '#/components/schemas/Hovedavsnitt'
        avsnitt:
          type: array
          items:
            $ref: '#/components/schemas/Avsnitt'
        brevGjelder:
          $ref: '#/components/schemas/Brevmottaker'
        sendtDato:
          type: string
        ytelse:
          $ref: '#/components/schemas/Ytelse'
        signatur:
          $ref: '#/components/schemas/Signatur'
    VedtaksbrevPeriode:
      type: object
      required:
        - fom
        - tom
        - beskrivelse
        - konklusjon
        - vurderinger
      properties:
        fom:
          type: string
          format: date
        tom:
          type: string
          format: date
        beskrivelse:
          type: array
          items:
            $ref: '#/components/schemas/Element'
        konklusjon:
          type: array
          items:
            $ref: '#/components/schemas/Element'
        vurderinger:
          type: array
          items:
            $ref: '#/components/schemas/VedtaksbrevVurdering'
    VedtaksbrevVurdering:
      type: object
      required:
        - tittel
        - beskrivelse
      properties:
        tittel:
          type: string
        beskrivelse:
          type: array
          items:
            $ref: '#/components/schemas/Element'
    Vurdering:
      type: object
      required:
        - årsak
      properties:
        årsak:
          anyOf:
            - $ref: '#/components/schemas/Fritekst'
            - type: 'null'
          minLength: 3
          maxLength: 3000
        oppdaget:
          $ref: '#/components/schemas/Oppdaget'
    Ytelse:
      type: object
      required:
        - url
        - ubestemtEntall
        - bestemtEntall
      properties:
        url:
          type: string
        ubestemtEntall:
          type: string
        bestemtEntall:
          type: string
